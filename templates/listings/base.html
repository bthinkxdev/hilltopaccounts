{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbfaf5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hill Top">
<link rel="manifest" href="{% static 'listings/manifest.webmanifest' %}">
<link rel="apple-touch-icon" href="{% static 'listings/icon-192.png' %}">
<link rel="icon" href="{% static 'listings/icon-192.png' %}">
<meta name="description" content="{% block meta_desc %}{{ brand }} — comfortable studios, 1 BHK homes and rooms in Al Khor, Qatar. Browse available spaces and enquire instantly on WhatsApp.{% endblock %}">
<meta property="og:site_name" content="{{ brand }}">
<meta property="og:title" content="{% block og_title %}{{ brand }} — Your comfort, our priority · Al Khor, Qatar{% endblock %}">
<meta property="og:description" content="{% block og_desc %}Comfortable homes and rooms in Al Khor, Qatar.{% endblock %}">
{% block og_image %}{% endblock %}
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>{% block title %}{{ brand }} — Your comfort, our priority · Al Khor, Qatar{% endblock %}</title>
<style>
:root{--bg:#fbfaf5;--fg:#0f2a21;--green:#0b5b41;--green2:#0f6e4f;--green-d:#0a4a37;--gold:#f2c230;--gold2:#ffd95a;--mute:#5b6a63;--line:#e3e8e0;--soft:#eef5ef;--mint:#e9f5ee;--r:22px;--ease:cubic-bezier(.2,.7,.2,1);--font:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--script:"Caveat","Segoe Script","Brush Script MT",cursive}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font);min-height:100dvh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{max-width:100%}
.app{min-height:100dvh;position:relative}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
@media(min-width:900px){.wrap{padding:0 28px}}
.ico{width:1em;height:1em;fill:currentColor;flex:none}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:16px;background:var(--green);color:#fff;font-weight:600;font-size:16px;border:0;width:100%;transition:transform .15s var(--ease),box-shadow .2s}
.btn:active{transform:scale(.98)}
.btn--wa{background:var(--green);box-shadow:0 10px 26px rgba(11,61,46,.3),inset 0 0 0 1px rgba(242,194,48,.45)}
.btn--wa .ico{color:var(--gold)}
.btn--wa .ico{font-size:22px}
.btn--off{background:var(--soft);color:var(--mute);pointer-events:none;box-shadow:none}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.02em;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.96);color:var(--green);box-shadow:0 1px 6px rgba(0,0,0,.15)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:#16a34a}
.badge--rented::before{background:#9a9a9a}
.car{position:relative;overflow:hidden;background:var(--soft)}
.car__track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.car__track::-webkit-scrollbar{display:none}
.car__slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;display:block;height:100%}
.car__slide img{display:block;width:100%;height:100%;object-fit:cover}
.car__empty{display:grid;place-items:center;height:100%;min-height:160px;color:var(--mute);font-size:12px;background:linear-gradient(135deg,#f5f5f5,#ebebeb)}
.car__dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:4px;pointer-events:none}
.car__dot{width:5px;height:5px;border-radius:99px;background:rgba(255,255,255,.65);transition:all .25s var(--ease);box-shadow:0 0 4px rgba(0,0,0,.25)}
.car__dot.on{width:15px;background:#fff}
.car__nav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.95);box-shadow:0 2px 12px rgba(0,0,0,.2);display:none;place-items:center;cursor:pointer;opacity:0;transition:opacity .2s;z-index:3}
.car__nav--prev{left:10px}.car__nav--next{right:10px}
@media(hover:hover) and (min-width:900px){.car__nav{display:grid}.car:hover .car__nav{opacity:1}}
/* shared site chrome */
.script{font-family:var(--script);font-weight:600;letter-spacing:0}
.ul-gold{position:relative;display:inline-block}
.ul-gold::after{content:"";position:absolute;left:-2%;right:-2%;bottom:-6px;height:6px;background:var(--gold);border-radius:6px;transform:rotate(-2deg);opacity:.95}
.site-head{position:relative;z-index:6;background:rgba(251,250,245,.92)}
.site-head .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:calc(env(safe-area-inset-top) + 12px);padding-bottom:12px}
.site-logo img{height:54px;width:auto;display:block}
.site-nav{display:flex;gap:30px;align-items:center}
.site-nav a{font-size:14px;font-weight:500;color:var(--fg);padding:8px 0;border-bottom:2px solid transparent}
.site-nav a.on{color:var(--green);font-weight:600;border-color:var(--green)}
.site-nav a:hover{color:var(--green)}
.wa-pill{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 22px;border-radius:99px;background:var(--green);color:#fff;font-weight:600;font-size:15px;box-shadow:0 10px 24px rgba(11,91,65,.28);white-space:nowrap}
.wa-pill .ico{font-size:24px}
@media(max-width:860px){.site-head .wrap{flex-wrap:wrap}.site-nav{order:3;flex:1 1 100%;gap:22px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.site-nav::-webkit-scrollbar{display:none}.site-logo img{height:44px}.wa-pill{height:42px;padding:0 14px;font-size:13px}.wa-pill .ico{font-size:20px}}
.glance-badge{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#fff;font-weight:600;font-size:13px;padding:8px 16px;border-radius:99px}
.cta-band{display:grid;gap:18px;align-items:center;background:linear-gradient(120deg,#0b5b41,#0a4a37);color:#fff;border-radius:26px;padding:26px 28px;box-shadow:0 22px 50px rgba(10,74,55,.28)}
.cta-band .script{font-size:clamp(26px,5vw,34px);line-height:1}
.cta-band .l{display:flex;align-items:center;gap:18px}
.cta-band .l svg{width:58px;height:58px;stroke:#fff;fill:none;flex:none}
.cta-band .m small{display:block;font-weight:600;font-size:14px;margin-bottom:8px}
.cta-band .num{display:inline-flex;align-items:center;gap:12px;background:rgba(255,255,255,.12);border-radius:99px;padding:8px 22px 8px 10px}
.cta-band .num .ico{font-size:40px}
.cta-band .num b{display:block;font-size:clamp(20px,5vw,26px);line-height:1.1;letter-spacing:-.01em}
.cta-band .num span{font-size:11.5px;opacity:.85}
.cta-band .r{text-align:center;color:var(--gold2);transform:rotate(-4deg)}
.cta-band .r .script{font-size:clamp(22px,4vw,28px);line-height:.95}
@media(min-width:900px){.cta-band{grid-template-columns:1fr 1.2fr .8fr;padding:30px 40px}.cta-band .m{border-left:1px solid rgba(255,255,255,.25);padding-left:34px}}
.follow{display:flex;flex-wrap:wrap;align-items:center;gap:18px 34px;margin-top:30px;font-size:13px}
.follow b{font-size:16px}
.follow a,.follow div{display:flex;align-items:center;gap:10px;line-height:1.25}
.follow small{display:block;color:var(--mute);font-size:11px}
.follow .loc{margin-left:auto;font-weight:600;font-size:15px;color:var(--fg)}
.follow .ico{font-size:34px}
.follow .ig{color:#c13584}.follow .fb{color:#1877f2}.follow .pin{color:var(--green)}
@media(max-width:700px){.follow .loc{margin-left:0}}
.foot-line{display:flex;align-items:center;gap:20px;justify-content:center;margin:34px 0 0;padding:0 0 calc(env(safe-area-inset-bottom) + 34px);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--green)}
.foot-line::before,.foot-line::after{content:"";height:1px;width:min(120px,18vw);background:var(--green);opacity:.7}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:38px 0 14px}
.sec-head h2{font-size:clamp(23px,5.5vw,34px);letter-spacing:-.03em;line-height:1.1;color:var(--green)}
.sec-head p{color:var(--mute);font-size:13.5px;margin-top:4px}
.chips{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:99px;flex:none}
.chip{padding:8px 16px;border-radius:99px;font-size:13px;font-weight:700;color:var(--mute);transition:all .2s}
.chip.on{background:var(--green);color:#fff;box-shadow:0 2px 10px rgba(11,61,46,.3)}
.feed{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-bottom:8px}
@media(min-width:720px){.feed{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}}
@media(min-width:1100px){.feed{grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}}
.card{display:flex;flex-direction:column;background:#fff;border-radius:20px;border:1px solid var(--line);overflow:hidden;box-shadow:0 1px 2px rgba(11,61,46,.05),0 10px 26px rgba(11,61,46,.08);transition:transform .3s var(--ease),box-shadow .3s;animation:rise .5s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(hover:hover){.card:hover{transform:translateY(-4px);box-shadow:0 2px 4px rgba(11,61,46,.06),0 24px 48px rgba(11,61,46,.16)}}
.card .car{aspect-ratio:4/5}
@media(min-width:720px){.card .car{aspect-ratio:4/3.4}}
.card__badges{position:absolute;top:10px;left:10px;z-index:2}
.card__body{display:block;padding:12px 12px 6px}
.card__name{font-size:14.5px;font-weight:800;letter-spacing:-.02em;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--green)}
.rt{display:inline-block;vertical-align:1px;margin-left:4px;padding:1px 7px;border-radius:99px;background:var(--mint);color:var(--green);font-size:10px;font-weight:700;letter-spacing:.02em}
.card__loc{display:flex;align-items:center;gap:4px;color:var(--mute);font-size:12px;margin-top:3px;overflow:hidden;white-space:nowrap}
.card__loc span{overflow:hidden;text-overflow:ellipsis}
.card__loc svg{flex:none}
.card__price{margin-top:8px;font-size:15px;font-weight:800;letter-spacing:-.02em}
.card__price small{font-size:11px;color:var(--mute);font-weight:500;margin-left:2px}
.card__act{padding:8px 12px 12px;margin-top:auto}
.wa{display:flex;align-items:center;justify-content:center;gap:7px;height:40px;border-radius:12px;background:var(--green);color:#fff;font-weight:700;font-size:13px;transition:transform .15s,background .2s;width:100%;box-shadow:inset 0 0 0 1px rgba(242,194,48,.5)}
.wa:active{transform:scale(.97)}
.wa .ico{font-size:17px;color:var(--gold)}
.wa--off{background:var(--soft);color:var(--mute);pointer-events:none;box-shadow:none}
@media(min-width:720px){.card__body{padding:16px 16px 6px}.card__name{font-size:17px}.card__loc{font-size:13px}.card__price{font-size:18px}.card__act{padding:10px 16px 16px}.wa{height:44px;font-size:14px}}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:70px 20px}

/* ===== mobile app mode ===== */
.tabbar{display:none}
@media(max-width:700px){
  body{font-size:14px;padding-bottom:calc(64px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
  a,button{touch-action:manipulation}
  .wrap{padding:0 12px}
  .site-head{position:sticky;top:0;background:rgba(251,250,245,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(11,91,65,.08)}
  .site-head .wrap{flex-wrap:nowrap;padding-top:calc(env(safe-area-inset-top) + 8px);padding-bottom:8px;gap:10px}
  .site-logo img{height:34px}
  .site-nav{display:none}
  .wa-pill{height:36px;padding:0 12px 0 10px;font-size:12.5px;gap:6px;box-shadow:0 4px 12px rgba(11,91,65,.25)}
  .wa-pill .ico{font-size:18px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;align-items:flex-end}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:#7c8a83;padding:4px 0;border-radius:12px;transition:color .15s}
  .tabbar a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .tabbar a.on{color:var(--green)}
  .tabbar a:active{transform:scale(.94)}
  .tabbar .tabbar__wa{flex:0 0 auto;width:52px;height:52px;margin:-22px 4px 0;border-radius:50%;background:var(--green);color:#fff;justify-content:center;box-shadow:0 8px 20px rgba(11,91,65,.4),inset 0 0 0 2px rgba(242,194,48,.7)}
  .tabbar .tabbar__wa .ico{width:26px;height:26px;fill:var(--gold);stroke:none}
  .sec-head{padding:18px 0 10px}
  .sec-head h2{font-size:20px}
  .sec-head p{font-size:12px}
  .chips{padding:3px}.chip{padding:6px 13px;font-size:12px}
  .feed{gap:8px}
  .card{border-radius:16px}
  .card .car{aspect-ratio:1/1}
  .card__body{padding:9px 10px 4px}
  .card__name{font-size:13.5px}
  .card__loc{font-size:11px}
  .card__price{margin-top:5px;font-size:14px}
  .card__act{padding:6px 10px 10px}
  .wa{height:36px;border-radius:10px;font-size:12.5px}
  .badge{font-size:10px;padding:4px 8px}
  .cta-band{border-radius:20px;padding:16px;gap:12px}
  .cta-band .l svg{width:40px;height:40px}
  .cta-band .script{font-size:24px}
  .cta-band .m small{font-size:12.5px;margin-bottom:6px}
  .cta-band .num{width:100%;padding:6px 16px 6px 8px}
  .cta-band .num .ico{font-size:32px}
  .cta-band .num b{font-size:19px}
  .cta-band .r{display:none}
  .follow{gap:10px 18px;margin-top:18px;font-size:12px}
  .follow b{width:100%;font-size:14px}
  .follow .ico{font-size:28px}
  .follow .loc{font-size:13px}
  .foot-line{margin-top:20px;padding-bottom:12px;font-size:11px;letter-spacing:.16em}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style>
{% block style %}{% endblock %}
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="wa" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></symbol></svg>
<div class="app">{% block body %}{% endblock %}</div>
<script>
(function(){
  var chev={prev:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0b3d2e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',next:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0b3d2e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>'};
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('[data-car]').forEach(function(car){
    var track=car.querySelector('.car__track'),dots=car.querySelectorAll('.car__dot'),n=track.children.length,i=0,timer,paused=false,visible=true;
    if(n<2)return;
    function show(k){dots.forEach(function(d,j){d.classList.toggle('on',j===k)})}
    function go(k){i=(k+n)%n;track.scrollTo({left:i*track.clientWidth,behavior:'smooth'})}
    track.addEventListener('scroll',function(){var k=Math.round(track.scrollLeft/track.clientWidth);if(k!==i){i=k;show(k)}},{passive:true});
    ['prev','next'].forEach(function(d){var b=document.createElement('button');b.type='button';b.className='car__nav car__nav--'+d;b.setAttribute('aria-label',d==='prev'?'Previous photo':'Next photo');b.innerHTML=chev[d];b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();go(i+(d==='next'?1:-1))});car.appendChild(b)});
    function start(){clearInterval(timer);if(reduce)return;timer=setInterval(function(){if(!paused&&visible&&!document.hidden)go(i+1)},3600)}
    ['touchstart','pointerdown'].forEach(function(e){track.addEventListener(e,function(){paused=true},{passive:true})});
    ['touchend','pointerup','pointercancel'].forEach(function(e){track.addEventListener(e,function(){paused=false;start()},{passive:true})});
    car.addEventListener('mouseenter',function(){paused=true});car.addEventListener('mouseleave',function(){paused=false});
    if('IntersectionObserver' in window){new IntersectionObserver(function(es){visible=es[0].isIntersecting}).observe(car)}
    show(0);setTimeout(start,Math.random()*1500);
  });
  var lb=document.getElementById('lightbox');
  if(lb){
    var imgs=[].slice.call(document.querySelectorAll('[data-zoom]')),idx=0,view=lb.querySelector('img'),cnt=lb.querySelector('.lb__count');
    function open(k){idx=(k+imgs.length)%imgs.length;view.src=imgs[idx].getAttribute('data-zoom');cnt.textContent=(idx+1)+' / '+imgs.length;lb.hidden=false;document.body.style.overflow='hidden'}
    function close(){lb.hidden=true;document.body.style.overflow=''}
    imgs.forEach(function(el,k){el.addEventListener('click',function(){open(k)})});
    lb.querySelector('.lb__close').onclick=close;lb.querySelector('.lb__prev').onclick=function(){open(idx-1)};lb.querySelector('.lb__next').onclick=function(){open(idx+1)};
    lb.addEventListener('click',function(e){if(e.target===lb)close()});
    document.addEventListener('keydown',function(e){if(lb.hidden)return;if(e.key==='Escape')close();if(e.key==='ArrowRight')open(idx+1);if(e.key==='ArrowLeft')open(idx-1)});
    var sx=0;lb.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});lb.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)open(idx+(dx<0?1:-1))},{passive:true});
  }
})();
</script>
</body>
</html>
