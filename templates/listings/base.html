<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d2e">
<meta name="description" content="{% block meta_desc %}{{ brand }} — comfortable studios, 1 BHK homes and rooms in Al Khor, Qatar. Browse available spaces and enquire instantly on WhatsApp.{% endblock %}">
<meta property="og:site_name" content="{{ brand }}">
<meta property="og:title" content="{% block og_title %}{{ brand }} — Your comfort, our priority · Al Khor, Qatar{% endblock %}">
<meta property="og:description" content="{% block og_desc %}Comfortable homes and rooms in Al Khor, Qatar.{% endblock %}">
{% block og_image %}{% endblock %}
<title>{% block title %}{{ brand }} — Your comfort, our priority · Al Khor, Qatar{% endblock %}</title>
<style>
:root{--bg:#f7f4ea;--fg:#0b2a20;--green:#0b3d2e;--green2:#0f5340;--gold:#f2c230;--gold2:#ffd95a;--mute:#5d6b64;--line:#e6e2d3;--soft:#efeadb;--r:22px;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100dvh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{max-width:100%}
.app{min-height:100dvh;position:relative}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
@media(min-width:900px){.wrap{padding:0 28px}}
.ico{width:1em;height:1em;fill:currentColor;flex:none}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:16px;background:var(--green);color:#fff;font-weight:600;font-size:16px;border:0;width:100%;transition:transform .15s var(--ease),box-shadow .2s}
.btn:active{transform:scale(.98)}
.btn--wa{background:var(--green);box-shadow:0 10px 26px rgba(11,61,46,.3),inset 0 0 0 1px rgba(242,194,48,.45)}
.btn--wa .ico{color:var(--gold)}
.btn--wa .ico{font-size:22px}
.btn--off{background:var(--soft);color:var(--mute);pointer-events:none;box-shadow:none}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.02em;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.96);color:var(--green);box-shadow:0 1px 6px rgba(0,0,0,.15)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:#16a34a}
.badge--rented::before{background:#9a9a9a}
.car{position:relative;overflow:hidden;background:var(--soft)}
.car__track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.car__track::-webkit-scrollbar{display:none}
.car__slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;display:block;height:100%}
.car__slide img{display:block;width:100%;height:100%;object-fit:cover}
.car__empty{display:grid;place-items:center;height:100%;min-height:160px;color:var(--mute);font-size:12px;background:linear-gradient(135deg,#f5f5f5,#ebebeb)}
.car__dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:4px;pointer-events:none}
.car__dot{width:5px;height:5px;border-radius:99px;background:rgba(255,255,255,.65);transition:all .25s var(--ease);box-shadow:0 0 4px rgba(0,0,0,.25)}
.car__dot.on{width:15px;background:#fff}
.car__nav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.95);box-shadow:0 2px 12px rgba(0,0,0,.2);display:none;place-items:center;cursor:pointer;opacity:0;transition:opacity .2s;z-index:3}
.car__nav--prev{left:10px}.car__nav--next{right:10px}
@media(hover:hover) and (min-width:900px){.car__nav{display:grid}.car:hover .car__nav{opacity:1}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style>
{% block style %}{% endblock %}
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="wa" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></symbol></svg>
<div class="app">{% block body %}{% endblock %}</div>
<script>
(function(){
  var chev={prev:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0b3d2e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',next:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0b3d2e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>'};
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('[data-car]').forEach(function(car){
    var track=car.querySelector('.car__track'),dots=car.querySelectorAll('.car__dot'),n=track.children.length,i=0,timer,paused=false,visible=true;
    if(n<2)return;
    function show(k){dots.forEach(function(d,j){d.classList.toggle('on',j===k)})}
    function go(k){i=(k+n)%n;track.scrollTo({left:i*track.clientWidth,behavior:'smooth'})}
    track.addEventListener('scroll',function(){var k=Math.round(track.scrollLeft/track.clientWidth);if(k!==i){i=k;show(k)}},{passive:true});
    ['prev','next'].forEach(function(d){var b=document.createElement('button');b.type='button';b.className='car__nav car__nav--'+d;b.setAttribute('aria-label',d==='prev'?'Previous photo':'Next photo');b.innerHTML=chev[d];b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();go(i+(d==='next'?1:-1))});car.appendChild(b)});
    function start(){clearInterval(timer);if(reduce)return;timer=setInterval(function(){if(!paused&&visible&&!document.hidden)go(i+1)},3600)}
    ['touchstart','pointerdown'].forEach(function(e){track.addEventListener(e,function(){paused=true},{passive:true})});
    ['touchend','pointerup','pointercancel'].forEach(function(e){track.addEventListener(e,function(){paused=false;start()},{passive:true})});
    car.addEventListener('mouseenter',function(){paused=true});car.addEventListener('mouseleave',function(){paused=false});
    if('IntersectionObserver' in window){new IntersectionObserver(function(es){visible=es[0].isIntersecting}).observe(car)}
    show(0);setTimeout(start,Math.random()*1500);
  });
  var lb=document.getElementById('lightbox');
  if(lb){
    var imgs=[].slice.call(document.querySelectorAll('[data-zoom]')),idx=0,view=lb.querySelector('img'),cnt=lb.querySelector('.lb__count');
    function open(k){idx=(k+imgs.length)%imgs.length;view.src=imgs[idx].getAttribute('data-zoom');cnt.textContent=(idx+1)+' / '+imgs.length;lb.hidden=false;document.body.style.overflow='hidden'}
    function close(){lb.hidden=true;document.body.style.overflow=''}
    imgs.forEach(function(el,k){el.addEventListener('click',function(){open(k)})});
    lb.querySelector('.lb__close').onclick=close;lb.querySelector('.lb__prev').onclick=function(){open(idx-1)};lb.querySelector('.lb__next').onclick=function(){open(idx+1)};
    lb.addEventListener('click',function(e){if(e.target===lb)close()});
    document.addEventListener('keydown',function(e){if(lb.hidden)return;if(e.key==='Escape')close();if(e.key==='ArrowRight')open(idx+1);if(e.key==='ArrowLeft')open(idx-1)});
    var sx=0;lb.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});lb.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)open(idx+(dx<0?1:-1))},{passive:true});
  }
})();
</script>
</body>
</html>
