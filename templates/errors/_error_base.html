<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block error_title %}Error{% endblock %} — Faisal Accounting</title>
  <style>
    :root { --bg: #f2f2f7; --text: #1c1c1e; --text-secondary: #6e6e73; --accent: #0a84ff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #000000; --text: #f5f5f7; --text-secondary: #98989d; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      padding: 24px; text-align: center;
    }
    .code { font-size: 15px; font-weight: 600; color: var(--text-secondary); letter-spacing: 0.04em; }
    h1 { font-size: 22px; margin: 8px 0; }
    p { color: var(--text-secondary); margin: 0 0 20px; }
    a { color: var(--accent); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div>
    <div class="code">{% block error_code %}{% endblock %}</div>
    <h1>{% block error_heading %}{% endblock %}</h1>
    <p>{% block error_message %}{% endblock %}</p>
    <a href="/">Return home</a>
  </div>
</body>
</html>
