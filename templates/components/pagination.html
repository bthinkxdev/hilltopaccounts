{% load querystring %}
{% if page_obj.has_other_pages %}
  <nav class="pagination" aria-label="Pagination">
    {% if page_obj.has_previous %}
      <a class="btn btn--ghost" href="?{{ request.GET|urlencode_without_page }}&page={{ page_obj.previous_page_number }}">&larr; Previous</a>
    {% endif %}
    <span class="pill pill--neutral">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
      <a class="btn btn--ghost" href="?{{ request.GET|urlencode_without_page }}&page={{ page_obj.next_page_number }}">Next &rarr;</a>
    {% endif %}
  </nav>
{% endif %}
