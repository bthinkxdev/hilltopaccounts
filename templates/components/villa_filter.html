<style>
.villa-checklist-dropdown { position: relative; display: inline-block; }

.villa-checklist-dropdown summary.collections-filter-select {
  height: 40px; min-height: 40px; padding: 8px 14px; font-size: 14px;
  background: var(--surface-solid, #1c1c1e); border: 1px solid var(--border-input, rgba(255,255,255,0.16));
  border-radius: var(--radius-sm, 10px); color: var(--text-primary); outline: none;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  cursor: pointer; user-select: none; box-sizing: border-box; min-width: 140px; box-shadow: none;
}
.villa-checklist-dropdown summary.collections-filter-select:focus {
  outline: none; box-shadow: none; border-color: var(--border-input, rgba(255,255,255,0.16));
}

.villa-checklist-dropdown-menu {
  position: absolute; top: calc(100% + 4px); z-index: 1050; width: 230px;
  background: var(--surface-solid, #1c1c1e); border: 1px solid var(--border-input, rgba(255,255,255,0.16));
  border-radius: var(--radius-sm, 10px); box-shadow: 0 12px 32px rgba(0,0,0,0.55); padding: 8px; box-sizing: border-box;
}
.collections-filter-bar .villa-checklist-dropdown-menu { right: 0; left: auto; }
.filter-bar .villa-checklist-dropdown-menu { left: 0; right: auto; }

form.filter-bar .villa-checklist-dropdown-menu input[type="text"],
form.collections-filter-bar .villa-checklist-dropdown-menu input[type="text"] {
  height: 32px; min-height: 32px; padding: 4px 8px; font-size: 12.5px;
  border: 1px solid var(--border-input, rgba(255,255,255,0.16)); border-radius: 6px;
  background: var(--surface-solid, #1c1c1e); color: var(--text-primary);
  margin: 0 0 6px 0; width: 100%; box-sizing: border-box; outline: none;
}

form.filter-bar .villa-checklist-dropdown-menu input[type="checkbox"],
form.collections-filter-bar .villa-checklist-dropdown-menu input[type="checkbox"] {
  width: 16px; height: 16px; min-height: 16px; margin: 0; padding: 0;
  border: 1px solid var(--border-input, rgba(255,255,255,0.3)); border-radius: 3px;
  flex-shrink: 0; cursor: pointer; accent-color: var(--accent, #2563eb);
}

.villa-checklist-items { max-height: 160px; overflow-y: auto; padding: 2px 0; display: flex; flex-direction: column; gap: 2px; }
.villa-chk-item {
  display: flex; align-items: center; gap: 8px; padding: 4px 6px;
  min-height: 28px; font-size: 13px; cursor: pointer; border-radius: 4px; color: var(--text-primary);
  user-select: none; margin: 0;
}
.villa-chk-item:hover { background: rgba(255,255,255,0.08); }
</style>

<details class="villa-checklist-dropdown">
  <summary class="collections-filter-select">
    <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px;">
      {% if not selected_villa_ids %}All Villas{% elif selected_villa_ids|length == 1 %}{% for v in villas %}{% if v.pk|stringformat:"s" in selected_villa_ids %}{{ v.name }}{% endif %}{% endfor %}{% else %}{{ selected_villa_ids|length }} Villas{% endif %}
    </span>
    <svg width="12" height="12" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.7; flex-shrink: 0;"><path d="M5 7.5l5 5 5-5"/></svg>
  </summary>

  <div class="villa-checklist-dropdown-menu">
    <input type="text" placeholder="Search villa..." onkeydown="if(event.key==='Enter')event.preventDefault()" oninput="this.closest('div').querySelectorAll('.villa-chk-item').forEach(el=>el.style.display=el.textContent.toLowerCase().includes(this.value.toLowerCase())?'flex':'none')" autocomplete="off">

    <label style="display: flex; align-items: center; gap: 8px; padding: 4px 6px; min-height: 26px; font-size: 12.5px; font-weight: 600; cursor: pointer; border-bottom: 1px solid var(--border-subtle, rgba(255,255,255,0.12)); color: var(--text-primary); margin: 0 0 3px 0;">
      <input type="checkbox" onchange="this.closest('div').querySelectorAll('.villa-chk-item:not([style*=\'none\']) input').forEach(c=>c.checked=this.checked)"> (Select All)
    </label>

    <div class="villa-checklist-items">
      {% for v in villas %}
        <label class="villa-chk-item">
          <input type="checkbox" name="villa" value="{{ v.pk }}" {% if v.pk|stringformat:"s" in selected_villa_ids %}checked{% endif %}>
          <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ v.name }}{% if v.business %} ({{ v.business.name }}){% endif %}</span>
        </label>
      {% endfor %}
    </div>

    <div style="display: flex; justify-content: flex-end; gap: 6px; padding-top: 6px; border-top: 1px solid var(--border-subtle, rgba(255,255,255,0.12)); margin-top: 4px;">
      <button type="button" class="btn btn--ghost btn--sm" style="padding: 2px 8px; font-size: 11.5px; height: 26px; min-height: 26px; cursor: pointer;" onclick="this.closest('details').removeAttribute('open')">Cancel</button>
      <button type="button" class="btn btn--primary btn--sm" style="padding: 2px 10px; font-size: 11.5px; height: 26px; min-height: 26px; cursor: pointer;" onclick="submitVillaFilter(this)">OK</button>
    </div>
  </div>
</details>

<script>
function submitVillaFilter(btn) {
  var form = btn.closest('form');
  if (form) {
    var q = form.querySelector('input[name="q"]');
    if (q && !q.value.trim()) q.disabled = true;
    form.submit();
  }
}
if (!window._villaDropdownInit) {
  window._villaDropdownInit = true;
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.villa-checklist-dropdown')) {
      document.querySelectorAll('.villa-checklist-dropdown[open]').forEach(function(d) { d.removeAttribute('open'); });
    }
  });
}
</script>
